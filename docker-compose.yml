services:

  database:
    image: postgres:15
    container_name: lp2taller3-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
     

  api:
    build:
      context: ./api
    container_name: lp2taller3-api
    restart: unless-stopped
    environment:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
    container_name: lp2taller3-web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      API_URL: http://api:8000
    depends_on:
        - api
    ports:
      - "5000:5000"

volumes:
  db_data: